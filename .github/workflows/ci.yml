# Continuous integration for colai.
#
# Every push and every pull request builds and tests the project on Linux,
# Windows and macOS, so a change that works on one platform but breaks another
# is caught before it merges. The toolbar is a Tauri app: a Node/vitest test
# suite for the web side and a Cargo build + test for the Rust side.
#
# macos-latest is an Apple Silicon runner, so it builds the darwin-arm64
# toolbar natively; WKWebView ships with the OS, so it needs no system
# packages. The Windows job also type-checks the macOS code paths, which is
# the cheap guard for anybody editing a `#[cfg(target_os = "macos")]` arm
# without a Mac to hand.
name: CI

on:
  push:
  pull_request:

# Cancel an in-flight run when a newer commit is pushed to the same ref, so the
# queue is never clogged with stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS's result rather than stopping the whole matrix on the
      # first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # --- Node / web side -------------------------------------------------
      # Node 24, not 22: Node 22 ships npm 10, whose dependency resolver crashes
      # ("Cannot read properties of null (reading 'edgesOut')") on vitest 4's
      # optional peer dependencies. npm 11, which ships with Node 24, installs
      # them cleanly.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The repo intentionally commits no package-lock.json (a lockfile would
      # make Claude Code's plugin copy install dependencies), so there is no
      # lockfile to feed `npm ci` — install from package.json instead. With no
      # lockfile, setup-node's own `cache: npm` has nothing to key on, so the
      # npm download cache is kept by hand, keyed on package.json; a change to
      # the dependencies falls back to the newest cache for this OS. npm keeps
      # that cache in ~/.npm on Linux and macOS and in AppData on Windows; a
      # path that does not exist on a runner is simply skipped.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        shell: bash
        run: npm install

      - name: Run the JS test suite
        shell: bash
        run: npm test

      # --- Rust / Tauri side -----------------------------------------------
      # The Tauri build links against GTK, WebKitGTK and the app-indicator /
      # rsvg system libraries on Linux. The Windows runner already ships the
      # WebView2 toolchain and macOS ships WKWebView, so these are only needed
      # on Ubuntu.
      #
      # Restored from a cache of the installed packages when it matches, which
      # skips the `apt-get update` and the download of a few hundred packages;
      # the cache is keyed on the list below, so editing it installs afresh.
      # Plain apt-get, deliberately not a package cache: cache-apt-pkgs-action
      # restores .deb contents without running their install scripts, which left
      # the GTK/WebKit dev packages half-configured and failed the Rust build at
      # its first build script. ~1 minute of apt is cheaper than a red build.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry, git index and the src-tauri target directory.
      # rust-cache keys on the toolchain, Cargo.lock and the job, and prunes the
      # target directory of the workspace's own crates before saving, so the
      # cache holds dependencies only and does not grow with every commit the
      # way a hand-rolled cache of the whole `target/` does.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: toolbar/src-tauri

      - name: Build the Rust toolbar
        shell: bash
        working-directory: toolbar/src-tauri
        run: cargo build

      - name: Run the Rust test suite
        shell: bash
        working-directory: toolbar/src-tauri
        run: cargo test

      # A type-check of the macOS code from Windows: nothing links, and the
      # script writes a stand-in C compiler so objc2's one build script can
      # finish. Catches a broken macOS arm before anybody reaches for a Mac.
      - name: Type-check the macOS toolbar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          node scripts/check-macos.mjs
