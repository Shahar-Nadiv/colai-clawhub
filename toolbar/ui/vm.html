<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Colai VM</title>
    <style>
      /* Claude's surfaces, as the toolbar wears them. */
      :root {
        --bg: #262624;
        --card: #20201e;
        --fg: #f9f9f7;
        --text: #c3c1b8;
        --muted: #9a988f;
        --line: color-mix(in srgb, var(--fg) 10%, transparent);
        --accent: #d97757;
        --ok: #7fb069;
        font-family: "anthropic-sans", system-ui, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf9f5;
          --card: #fff;
          --fg: #141413;
          --text: #3d3d3a;
          --muted: #73726c;
          --accent: #c6613f;
        }
      }
      * {
        box-sizing: border-box;
      }
      /* `hidden` wins over every display rule below. */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .vm-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .vm-dot {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--muted);
      }
      .vm-dot[data-on="true"] {
        background: var(--ok);
      }
      .vm-name {
        color: var(--fg);
        font-weight: 600;
      }
      .vm-chip {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 9999px;
        background: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      .vm-seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        margin-left: auto;
        border-radius: 9999px;
        background: color-mix(in srgb, var(--fg) 7%, transparent);
      }
      .vm-seg button,
      .vm-act {
        all: unset;
        cursor: pointer;
        padding: 3px 12px;
        border-radius: 9999px;
        font-size: 12px;
        color: var(--muted);
      }
      .vm-seg button[data-on="true"] {
        background: var(--card);
        color: var(--fg);
      }
      .vm-act {
        color: var(--text);
      }
      .vm-act:hover {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      .vm-seg button:focus-visible,
      .vm-act:focus-visible {
        outline: 2px solid var(--accent);
      }
      .vm-spec {
        color: var(--muted);
        font-size: 11px;
      }
      .vm-screen {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #0f1115;
      }
      .vm-said {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="vm-bar">
      <span class="vm-dot" id="dot"></span>
      <span class="vm-name" id="name">VM</span>
      <span class="vm-chip" id="owner" hidden></span>
      <div class="vm-seg" role="group" aria-label="Who drives">
        <button type="button" id="agent" data-on="true">Agent drives</button>
        <button type="button" id="you" data-on="false">You drive</button>
      </div>
      <span class="vm-spec" id="spec"></span>
      <button type="button" class="vm-act" id="save">Save point</button>
      <button type="button" class="vm-act" id="restore" hidden>Back to save point</button>
      <button type="button" class="vm-act" id="reset">Reset</button>
      <button type="button" class="vm-act" id="stop">Stop</button>
    </div>
    <div class="vm-screen" id="screen">
      <div class="vm-said" id="said">Connecting…</div>
    </div>
    <script type="module" src="vm.js"></script>
  </body>
</html>
